# ---------------------------------------------------------------------------
# /opt/home-infra/compose.yml — portable web-control stack
#
#   Internet ──443──► caddy ──forward_auth──► authentik ──► guacamole ──► guacd
#                                                   │
#                                              postgres + redis
#
# Design rules this file follows:
#   * No secrets inline. Everything sensitive comes from .env (git-ignored).
#   * No host IPs. Services address each other by container name, so the same
#     file runs unchanged on the Lenovo L590 and on the HP T640.
#   * Only Caddy publishes host ports (80/443). Nothing else is reachable
#     from the LAN, let alone the Internet.
#   * All state lives under ${DATA_ROOT} as bind mounts, so backup.sh can
#     archive it and migrate-to-t640.sh can rsync it verbatim.
# ---------------------------------------------------------------------------

name: home-infra

x-restart: &restart
  restart: unless-stopped

services:
  # --- Reverse proxy / TLS terminator --------------------------------------
  caddy:
    <<: *restart
    image: caddy:${CADDY_TAG}
    container_name: home-infra-caddy
    ports:
      - "80:80"     # required for the ACME HTTP-01 challenge + HTTPS redirect
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
      TZ: ${TZ}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT}/caddy/data:/data       # ACME account + issued certs
      - ${DATA_ROOT}/caddy/config:/config
    networks:
      - edge
    depends_on:
      authentik-server:
        condition: service_healthy

  # --- Shared database ------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:${POSTGRES_TAG}
    container_name: home-infra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by postgres/initdb/01-guacamole-db.sh on first boot only.
      GUACAMOLE_DB_NAME: ${GUACAMOLE_DB_NAME}
      GUACAMOLE_DB_USER: ${GUACAMOLE_DB_USER}
      GUACAMOLE_DB_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      # Scripts here run in filename order, once, against an empty data dir.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      # Guacamole's DDL, generated by scripts/init-guac-schema.sh and loaded
      # by 02-load-guacamole-schema.sh. Git-ignored: it is vendor output.
      - ./guacamole/schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  redis:
    <<: *restart
    image: redis:${REDIS_TAG}
    container_name: home-infra-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # --- Identity provider ----------------------------------------------------
  # Served at the root of ${CADDY_DOMAIN}. authentik does not support being
  # hosted under a sub-path, which is why it owns "/" and the other apps get
  # sub-paths. See caddy/README.md.
  authentik-server:
    <<: *restart
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: home-infra-authentik-server
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/authentik/media:/media
      - ${DATA_ROOT}/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 90s
    networks:
      - edge      # reachable by caddy
      - internal  # reachable by postgres/redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  authentik-worker:
    <<: *restart
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: home-infra-authentik-worker
    command: worker
    environment: *authentik-env
    # The worker needs the Docker socket only if you use authentik's outpost
    # auto-deployment. The embedded outpost used here does not, so it stays
    # unmounted — one fewer root-equivalent handle in the stack.
    volumes:
      - ${DATA_ROOT}/authentik/media:/media
      - ${DATA_ROOT}/authentik/certs:/certs
      - ${DATA_ROOT}/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 90s
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Clientless remote desktop gateway ------------------------------------
  guacd:
    <<: *restart
    image: guacamole/guacd:${GUACD_TAG}
    container_name: home-infra-guacd
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/guacamole/recordings:/var/lib/guacamole/recordings
      - ${DATA_ROOT}/guacamole/drive:/var/lib/guacamole/drive
    networks:
      - internal
      # guacd is what actually dials RDP/SSH on the LAN, so it needs an
      # unrestricted network. "internal" is a normal bridge for this reason;
      # nothing in the stack publishes a port except caddy.

  guacamole:
    <<: *restart
    image: guacamole/guacamole:${GUACAMOLE_TAG}
    container_name: home-infra-guacamole
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${GUACAMOLE_DB_NAME}
      POSTGRESQL_USER: ${GUACAMOLE_DB_USER}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "false"
      # The image serves the app at /guacamole, which is exactly the sub-path
      # Caddy publishes — so no prefix rewriting is needed anywhere.
      WEBAPP_CONTEXT: guacamole
      # Trust the forwarded client IP from Caddy for logging / brute-force
      # protection. Caddy is the only thing that can reach this container.
      REMOTE_IP_VALVE_ENABLED: "true"
      PROXY_ALLOWED_IPS_REGEX: '^.*$$'
      TZ: ${TZ}
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started

  # --- AI web UI ------------------------------------------------------------
  # Open WebUI is reachable only through Caddy at /ai/. Ollama stays on the
  # private Tailscale network and is never published by this Compose project.
  open-webui:
    <<: *restart
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG}
    container_name: home-infra-open-webui
    environment:
      WEBUI_URL: ${OPEN_WEBUI_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      ENABLE_COMPRESSION_MIDDLEWARE: "false"
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      ENABLE_WEBSOCKET_SUPPORT: "true"
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/open-webui:/app/backend/data
    networks:
      - edge

  # --- Existing Uptime Kuma -------------------------------------------------
  # Deliberately NOT defined here. Kuma already runs as a standalone container
  # on the Lenovo with its own volume and Telegram alerting; adopting it into
  # this stack would recreate the container and risk its history.
  # It also has no sub-path support, so it cannot be published under
  # ${CADDY_DOMAIN}/kuma/ — keep reaching it over Tailscale on :3001.
  # See docs/ARCHITECTURE.md § "Uptime Kuma" for the options.

networks:
  edge:
    name: home-infra-edge
  internal:
    name: home-infra-internal
